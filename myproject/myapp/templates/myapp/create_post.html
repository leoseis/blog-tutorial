<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog Post</title>

    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Main Container */
        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Page Heading */
        .page-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-heading h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .page-heading p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
        }

        /* Form Card */
        .form-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.07);
            border: 1px solid #e8edf4;
        }

        /* Django Form Fields */
        form p {
            margin-bottom: 22px;
        }

        form label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
            color: #334155;
        }

        form input,
        form textarea,
        form select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            background: #f8fafc;
            font-family: inherit;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s ease,
                        box-shadow 0.2s ease,
                        background 0.2s ease;
        }

        form textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 1.7;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        /* Help Text */
        form .helptext {
            display: block;
            margin-top: 7px;
            font-size: 12px;
            color: #64748b;
        }

        /* Validation Errors */
        .errorlist {
            list-style: none;
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 8px;
        }

        /* Buttons */
        .form-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            flex: 1;
            background: #4f46e5;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(79, 70, 229, 0.25);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* Footer */
        .form-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #94a3b8;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            body {
                padding: 25px 14px;
            }

            .page-heading h1 {
                font-size: 26px;
            }

            .form-card {
                padding: 23px 18px;
                border-radius: 14px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="page-heading">
            <h1>Create a Blog Post</h1>
            <p>Share your thoughts, ideas, and stories with your readers.</p>
        </div>

        <div class="form-card">

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        Save Post
                    </button>

                    <div class="form-actions">
    <button type="submit" class="btn btn-primary">
        Save Post
    </button>
</div>
                </div>
            </form>

        </div>

        <div class="form-footer">
            Your ideas deserve to be shared.
        </div>

    </div>

</body>
</html>
